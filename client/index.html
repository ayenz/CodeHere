<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Share code in real time. Open a room, send the link, edit together." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>CodeHere</title>
    <!-- Loaded in <head> so the page never renders without styles. -->
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem('codehere:theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#editor">Skip to editor</a>

    <header class="topbar">
      <a class="brand" href="/" title="Start a new room">
        <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6 2 12l6 6M16 6l6 6-6 6" />
        </svg>
        <span>CodeHere</span>
      </a>

      <p class="room-id">
        <span class="sr-only">Room</span>
        <code id="room-id"></code>
      </p>

      <section class="presence" aria-labelledby="people-heading">
        <h2 id="people-heading" class="sr-only">People in this room</h2>
        <ul id="people" class="people"></ul>
        <button id="rename" class="avatar you" type="button">
          <span id="you-initial" aria-hidden="true"></span>
          <span id="you-label" class="sr-only"></span>
        </button>
      </section>

      <div class="toolbar" role="toolbar" aria-label="Room actions">
        <label class="sr-only" for="language">Language</label>
        <select id="language" class="ghost select"></select>

        <button id="download" class="ghost icon" type="button" aria-label="Download file" title="Download file">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" />
          </svg>
        </button>

        <button id="theme" class="ghost icon" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" />
          </svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>

        <button id="copy-link" class="share" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" />
            <path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" />
          </svg>
          <span>Share</span>
        </button>
      </div>
    </header>

    <main id="editor" class="editor" tabindex="-1" aria-label="Shared code editor"></main>

    <footer class="statusbar">
      <span id="status" class="status" role="status" data-state="connecting">Connecting…</span>
      <span id="position" class="position" aria-hidden="true"></span>
      <div class="statusbar-end">
        <span class="hint">Press <kbd>Esc</kbd> then <kbd>Tab</kbd> to leave the editor</span>
        <label class="sr-only" for="editor-theme">Editor theme</label>
        <select id="editor-theme" class="ghost select compact" title="Editor theme"></select>
      </div>
    </footer>

    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <!-- Visual-only toast; screen readers get the same message from #announcer. -->
    <div id="toast" class="toast" aria-hidden="true"></div>

    <dialog id="name-dialog" aria-labelledby="name-dialog-title">
      <form method="dialog" class="dialog-body">
        <h2 id="name-dialog-title">Your name</h2>
        <p class="muted">Shown to others next to your cursor.</p>
        <label class="sr-only" for="name-input">Name</label>
        <input id="name-input" name="name" class="field" maxlength="32" autocomplete="nickname" required />
        <div class="dialog-actions">
          <button id="name-cancel" class="ghost" type="button">Cancel</button>
          <button class="share" value="save">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
