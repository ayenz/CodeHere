# CodeHere with Docker Compose. Configuration comes from .env (see .env.example).
#
#   docker compose up -d --build                       # app + SQLite in a volume
#   docker compose --profile postgres up -d --build    # + PostgreSQL
#   docker compose --profile mysql up -d --build       # + MySQL
#   docker compose --profile https up -d --build       # + Caddy with automatic HTTPS
#
# Profiles combine, e.g. --profile postgres --profile https. See docs/deployment.md.
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed inside the container; everything else comes from .env.
      HOST: 0.0.0.0
      PORT: 3000
      SQLITE_PATH: /data/codehere.db
    ports:
      # Set PUBLISH=127.0.0.1:3000 when a reverse proxy runs on the same machine.
      - "${PUBLISH:-3000}:3000"
    volumes:
      - app-data:/data
    restart: unless-stopped

  caddy:
    profiles: [https]
    image: caddy:2
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  postgres:
    profiles: [postgres]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codehere
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codehere}
      POSTGRES_DB: codehere
    # Not published on the host: the app reaches it as postgres:5432.
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_USER: codehere
      MYSQL_PASSWORD: ${DB_PASSWORD:-codehere}
      MYSQL_DATABASE: codehere
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    # Not published on the host: the app reaches it as mysql:3306.
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config:
  pg-data:
  mysql-data:
