# Example nginx site for CodeHere running on 127.0.0.1:3000 (e.g. with systemd).
# Replace example.com / admin.example.com, then get certificates with:
#   sudo certbot --nginx -d example.com -d admin.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com admin.example.com;

    # Large pastes arrive as WebSocket frames, not request bodies; this only covers the admin API.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets (real-time editing) need these.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        # CodeHere uses Host to tell the admin host apart; with TRUST_PROXY=true it also
        # reads the client IP and scheme from these headers.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: never pass on what the client claims.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
